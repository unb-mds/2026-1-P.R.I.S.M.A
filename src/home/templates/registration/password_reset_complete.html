{% extends "registration/base_auth.html" %}

{% block title %}Senha Alterada{% endblock %}

{% block content %}
<div class="glass-card text-center">
    <div class="mb-8">
        <div class="mx-auto w-16 h-16 bg-green-50 rounded-full flex items-center justify-center mb-4 border border-green-100">
            <i data-lucide="check-circle-2" class="w-8 h-8 text-brand-success"></i>
        </div>
        <h2 class="text-3xl font-display font-bold text-brand-text mb-3">Senha alterada!</h2>
        <p class="text-brand-text-muted text-sm leading-relaxed">
            Sua senha foi redefinida com sucesso. 
            Você já pode acessar sua conta utilizando a nova senha.
        </p>
    </div>

    <div class="mt-6 border-t border-brand-outline pt-6">
        <a href="{% url 'login' %}" class="auth-btn inline-block">
            Entrar agora
        </a>
    </div>
</div>
{% endblock %}
