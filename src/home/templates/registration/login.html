<!DOCTYPE html>
<html>
<head>
    <title>Login - P.R.I.S.M.A</title>
</head>
<body>

<h1>Entrar</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">
        Entrar
    </button>
</form>

<p>
    Não possui conta?
    <a href="{% url 'signup' %}">
        Cadastre-se
    </a>

    <a href="{% url 'password_reset' %}">
        Esqueci minha senha
    </a>

</p>

</body>
</html>
