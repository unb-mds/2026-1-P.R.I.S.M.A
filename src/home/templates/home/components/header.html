<header
  class="h-[72px] bg-white border-b border-brand-outline flex items-center justify-between px-8 sticky top-0 z-10 shrink-0 w-full"
>
  <div class="flex items-center gap-8 flex-1">
    <h2
      id="topnav-title"
      class="font-display font-semibold text-2xl text-brand-text truncate max-w-md capitalize"
    >
      {% block page_title %}{% endblock %}
    </h2>


  </div>

  <div class="flex items-center gap-4 ml-4">
    <button class="text-slate-400 hover:text-brand-primary transition-colors">
      <i data-lucide="settings" class="w-5 h-5"></i>
    </button>
    <button class="text-slate-400 hover:text-brand-primary transition-colors">
      <i data-lucide="help-circle" class="w-5 h-5"></i>
    </button>
  </div>
</header>
