{% load static %}
<div
  class="w-64 bg-brand-primary text-white h-screen flex flex-col fixed left-0 top-0 border-r border-[#1a365d] z-50"
>
  <div class="p-6">
    <h1 class="font-display font-bold text-xl tracking-tight">P.R.I.S.M.A</h1>
    <p
      class="text-xs text-blue-200 mt-1 uppercase tracking-widest font-semibold opacity-70"
    >
      Monitor de Prazos
    </p>
  </div>

  <nav class="flex-1 px-4 py-4 space-y-1 overflow-y-auto" id="sidebar-nav">
    <a
      href="{% url 'processos' %}"
      class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-md transition-colors text-sm font-medium {% if active_page == 'processos' %}bg-white/5 text-white border-brand-primary{% else %}text-slate-300 hover:text-white hover:bg-white/5 border-transparent{% endif %} border-l-2"
    >
      <i data-lucide="file-text" class="w-[18px] h-[18px] text-slate-400"></i>
      Processos Legislativos
    </a>

    <a
      href="{% url 'favoritos' %}"
      class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-md transition-colors text-sm font-medium {% if active_page == 'favoritos' %}bg-white/5 text-white border-brand-primary{% else %}text-slate-300 hover:text-white hover:bg-white/5 border-transparent{% endif %} border-l-2"
    >
      <i data-lucide="star" class="w-[18px] h-[18px] text-slate-400"></i>
      Favoritos
    </a>
    <a
      href="{% url 'alertas' %}"
      class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-md transition-colors text-sm font-medium {% if active_page == 'alertas' %}bg-white/5 text-white border-brand-primary{% else %}text-slate-300 hover:text-white hover:bg-white/5 border-transparent{% endif %} border-l-2"
    >
      <i data-lucide="bell" class="w-[18px] h-[18px] text-slate-400"></i>
      Alertas
    </a>

    <div class="h-px bg-white/10 my-4 mx-2"></div>

    <a
      href="{% url 'usuario' %}"
      class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-md transition-colors text-sm font-medium {% if active_page == 'usuario' %}bg-white/5 text-white border-brand-primary{% else %}text-slate-300 hover:text-white hover:bg-white/5 border-transparent{% endif %} border-l-2"
    >
      <i data-lucide="settings" class="w-[18px] h-[18px] text-slate-400"></i>
      Configurações
    </a>
  </nav>


</div>
