[project]
name = "2026-1-p-r-i-s-m-a"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asgiref==3.11.1",
    "django==6.0.4",
    "django-crontab>=0.7.1",
    "django-jazzmin>=3.0.4",
    "django-filter>=25.2",
    "dotenv>=0.9.9",
    "psycopg[binary]>=3.3.4",
    "requests>=2.34.2",
    "sqlparse==0.5.5",
]

[tool.black]
line-length = 88
target-version = ['py311']
exclude = '/(\.eggs|\.git|\.venv|venv|migrations|__pycache__)/'

[tool.isort]
profile = "black"
line_length = 88
skip = ["venv", ".venv", "migrations"]

[dependency-groups]
dev = [
    "playwright>=1.60.0",
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
    "pytest-playwright>=0.8.0",
]
